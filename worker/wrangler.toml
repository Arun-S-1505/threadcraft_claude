name = "threadcraft-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The API answers on the same address as the site, so the browser and the admin login stay same-origin.
routes = [{ pattern = "www.threadcraft.company/api/*", zone_name = "threadcraft.company" }]

# Non-secret settings. Secrets (RESEND_API_KEY, RAZORPAY_WEBHOOK_SECRET) go in
# `wrangler secret put`, never in this file. Local values live in .dev.vars.
[vars]
# Razorpay: add RAZORPAY_KEY_ID here (public id) and set RAZORPAY_KEY_SECRET + RAZORPAY_WEBHOOK_SECRET with `wrangler secret put`.
ALLOWED_ORIGIN = "https://www.threadcraft.company"
OWNER_EMAIL = "threadcraftcustomwear@gmail.com"
FROM_EMAIL = "ThreadCraft <orders@threadcraft.company>"  # threadcraft.company must be verified in Resend
ADMIN_EMAILS = "threadcraftcustomwear@gmail.com"  # allowlist, checked on top of Cloudflare Access
ACCESS_TEAM_DOMAIN = ""  # e.g. yourteam.cloudflareaccess.com
ACCESS_AUD = ""          # Application Audience (AUD) tag from the Access app

[[d1_databases]]
binding = "DB"
database_name = "threadcraft"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[[r2_buckets]]
binding = "FILES"
bucket_name = "threadcraft-files"

# Abuse protection for public routes (10 requests / 60 s per IP)
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

# Monthly backup of last month's orders + messages into R2 (03:00 UTC on the 1st)
[triggers]
crons = ["0 3 1 * *"]
